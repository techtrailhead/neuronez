<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Study Lab | Architect the Future</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Rajdhani', 'sans-serif'],
              display: ['Russo One', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              bg: {
                950: '#000000', // Pure Black
                900: '#0c0a09', // Stone 950
                800: '#1c1917', // Stone 900
              },
              magma: {
                400: '#fb923c', // Orange 400
                500: '#f97316', // Orange 500
                600: '#ea580c', // Orange 600
                glow: '#f9731680'
              },
              ember: {
                400: '#f87171', // Red 400
                500: '#ef4444', // Red 500
                600: '#dc2626', // Red 600
              },
              ash: {
                500: '#78716c', // Stone 500
                900: '#292524',
              }
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #292524 1px, transparent 1px), linear-gradient(to bottom, #292524 1px, transparent 1px)",
            },
            animation: {
              'rise': 'rise 4s infinite linear',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'flicker': 'flicker 3s infinite alternate',
              'flame-pulse': 'flame-pulse 3s infinite alternate',
            },
            keyframes: {
              rise: {
                '0%': { transform: 'translateY(0) scale(1)', opacity: '0' },
                '10%': { opacity: '1' },
                '100%': { transform: 'translateY(-80vh) scale(0.2)', opacity: '0' },
              },
              flicker: {
                '0%, 19%, 21%, 23%, 25%, 54%, 56%, 100%': { 
                  boxShadow: '0 0 10px rgba(249, 115, 22, 0.2), 0 0 20px rgba(249, 115, 22, 0.1)' 
                },
                '20%, 24%, 55%': { 
                  boxShadow: 'none' 
                }
              },
              'flame-pulse': {
                '0%': { opacity: '0.5', transform: 'scaleY(1)' },
                '100%': { opacity: '0.8', transform: 'scaleY(1.1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000000;
        color: #e7e5e4;
        overflow-x: hidden;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0c0a09;
      }
      ::-webkit-scrollbar-thumb {
        background: #44403c;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ea580c;
      }

      .glass-card {
        background: rgba(28, 25, 23, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(234, 88, 12, 0.1);
      }
      
      .glass-card:hover {
        border: 1px solid rgba(234, 88, 12, 0.4);
        box-shadow: 0 0 30px rgba(234, 88, 12, 0.1);
      }

      .text-glow-fire {
        text-shadow: 0 0 20px rgba(249, 115, 22, 0.6);
      }
      
      .clip-path-hexagon {
        clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
      }

      .grid-bg {
        background-size: 50px 50px;
        mask-image: radial-gradient(circle at center, black 30%, transparent 70%);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
